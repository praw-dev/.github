jobs:
  release_tag:
    if: "startsWith(github.event.head_commit.message, 'Merge pull request #') && contains(github.event.head_commit.message, format(' from {0}/prepare_release_v', github.repository_owner))"
    name: Tag Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install dependencies
        run: uv tool install "praw-release @ https://github.com/praw-dev/praw-release/archive/3d8192218ab9e86bd027ee354dc7b9623160e4e8.zip" # v1.2.1
      - name: Extract Version
        run: |
          git checkout HEAD^2^
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log --format=%B -n 1 | praw-release extract-version > tmp_version
          echo "version=$(cat tmp_version)" >> "$GITHUB_ENV"
          cat tmp_version | uv run --no-project --with packaging python -c 'import sys; from packaging import version; print(int(version.Version(sys.stdin.readline()).is_prerelease))' > tmp_is_prerelease
          echo "is_prerelease=$(cat tmp_is_prerelease)" >> "$GITHUB_ENV"
      - name: Extract Change Log
        run: praw-release changes "$version" > version_changelog
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Create GitHub Release
        run: |
          args=(--draft --notes-file version_changelog --target "$commit" --title "v$version")
          if [ "$is_prerelease" = "1" ]; then
            args+=(--prerelease)
          fi
          gh release create "v$version" "${args[@]}"
name: Tag Release
on: workflow_call
permissions:
  contents: write
