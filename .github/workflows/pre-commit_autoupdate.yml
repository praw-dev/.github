jobs:
  auto-update:
    name: Auto-update pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      # The app token lets create-pull-request push a branch that triggers CI
      # and open PRs despite the org-wide block on GITHUB_TOKEN PR creation.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install dependencies
        # The lint group provides pre-commit; the project itself is installed
        # for repos whose local hooks import it.
        run: uv sync --frozen --group lint
      - name: Update hooks
        run: uv run --no-sync pre-commit autoupdate --freeze
      - name: Run hooks
        run: uv run --no-sync pre-commit run --all-files
        continue-on-error: true
      - id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        # create-pull-request commits the autoupdate changes, pushes a branch, and
        # opens the PR -- functionality `gh pr create` alone does not provide.
        # zizmor: ignore[superfluous-actions]
        with:
          branch: update/pre-commit-hooks
          title: Update pre-commit hooks
          commit-message: Update pre-commit hooks
          body: Update versions of pre-commit hooks to the latest version.
          token: ${{ steps.app-token.outputs.token }}
      - name: Enable auto-merge
        # Queues the PR to merge once the required checks pass. The app token is
        # reused rather than GITHUB_TOKEN because branch protection on main
        # restricts pushes to the praw-dev-automation app; github-actions[bot] is
        # not on that allowlist and so cannot complete the merge.
        if: steps.create-pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        run: gh pr merge --auto --merge "$PR_URL"
name: Update pre-commit hooks
on:
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
