jobs:
  prepare_release:
    name: Prepare Release v${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    steps:
      # The app token lets create-pull-request push a branch that triggers CI
      # and open PRs despite the org-wide block on GITHUB_TOKEN PR creation.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install dependencies
        run: uv tool install "praw-release @ https://github.com/praw-dev/praw-release/archive/afe2ced623a9a7a4d3e96921de942f163f04bc6f.zip" # v1.1.1
      - name: Prepare Git Variables
        run: |
          git config --global author.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global author.name "$GITHUB_ACTOR"
          git config --global committer.email noreply@github.com
          git config --global committer.name GitHub
      - name: Normalize version and update in code
        env:
          PACKAGE: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          praw-release bump "$PACKAGE" "$REQUESTED_VERSION" "$PACKAGE/$VERSION_FILE" > tmp_version
          echo "version=$(cat tmp_version)" >> "$GITHUB_ENV"
          rm tmp_version
      - name: Commit changes with desired version
        run: git commit -am "Bump to v$version"
      - name: Update code with next development version
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          praw-release bump "$PACKAGE" unreleased "$PACKAGE/$VERSION_FILE" > tmp_version
          echo "dev_version=$(cat tmp_version)" >> "$GITHUB_ENV"
          rm tmp_version
      - name: Commit changes with development version
        run: git commit -am "Set development version v$dev_version"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          body: ""
          branch: prepare_release_v${{ env.version }}
          draft: false
          title: Release v${{ env.version }}
          token: ${{ steps.app-token.outputs.token }}

name: Prepare Release
on:
  workflow_call:
    inputs:
      package:
        type: string
        description: The name of the package to build
        required: true
      version:
        type: string
        description: The version to prepare for release
        required: true
      version_file:
        type: string
        description: The filename that contains the __version__ variable
        required: true
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
